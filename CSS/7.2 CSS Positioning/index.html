<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    .blue-box{
      background-color: blue;
      height: 300px;
      width:500px;
      position: fixed;
      top:200px;
      left: 200px;
    }
    .red-circle{
      background-color: red;
      z-index: 2;
      border-radius: 50%;
      height: 100px;
      width:100px;
      position: relative;
      top:150px;
      left:250px;
    }

  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>

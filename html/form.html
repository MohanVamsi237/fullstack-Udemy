                <h2>Registration Form</h2>
            </td>

    <hr>

    <!-- Name -->
    <input type="text" placeholder="Enter your name">
    <br><br>

    <!-- Age -->
    <input type="number" placeholder="Enter your age">
    <br><br>

    <!-- Date of Birth -->
    <input type="date">
    <br><br>

    <!-- Email -->
    <input type="email" placeholder="Enter your email">
    <br><br>

    <!-- Password -->
    <input type="password" placeholder="Enter your password">
    <br><br>

    <!-- Mobile Number -->
    <input type="tel" placeholder="Enter your mobile number">
    <br><br>

    <!-- Portfolio -->
    <input type="url" placeholder="Enter your portfolio website">
    <br>

    <!-- Resume -->
    <p>Upload your resume:</p>
    <input type="file">
    <br>

    <!-- Gender -->
    <p>Gender:</p>

    <input type="radio" name="gender" value="male">
    Male

    <input type="radio" name="gender" value="female">
    Female

    <input type="radio" name="gender" value="other">
    Others

    <!-- Year of Study -->
    <p>
        Year of Study:

        <select name="yearOfStudy" id="yearOfStudy">
            <option value="1st year">1st year</option>
            <option value="2nd year">2nd year</option>
            <option value="3rd year">3rd year</option>
            <option value="4th year">4th year</option>
        </select>
    </p>

    <!-- Address -->
    <textarea
        name="address"
        id="address"
        cols="30"
        rows="5"
        placeholder="Enter your address"></textarea>

    <br><br>

    <!-- Languages -->
    <p>Languages Known:</p>

    <input type="checkbox" name="languages" value="C">
    C
    <br>

    <input type="checkbox" name="languages" value="C++">
    C++
    <br>

    <input type="checkbox" name="languages" value="Java">
    Java
    <br>

    <input type="checkbox" name="languages" value="Python">
    Python

    <br><br>

    <!-- Buttons -->
    <input type="reset" value="Reset">

    <input type="submit" value="Submit">

</body>
